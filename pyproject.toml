[project]
name = "hympnn"
version = "0.1.0"
description = "Hybrid equivariant graph neural networks for QM9"
requires-python = ">=3.10"
dependencies = ["networkx", "numpy", "torch"]

[project.scripts]
hympnn-train-qm9 = "hympnn.train_qm9:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hympnn.cuda" = ["*.cu"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
